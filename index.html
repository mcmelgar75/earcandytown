    <style>
        :root {
            --bg-main: #0b0c10;
            --bg-card: #15171e;
            --bg-card-hover: #1e222d;
            --text-main: #ffffff;
            --text-muted: #a0a5b5;
            --accent-orange: #ff7e29;
            --accent-pink: #ff477e;
            --gradient-accent: linear-gradient(135deg, #ff9e2c 0%, #ff5e62 50%, #ff477e 100%);
            --font-family: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* HEADER & NAV */
        header {
            position: sticky;
            top: 0;
            background: rgba(11, 12, 16, 0.92);
            backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            height: 40px;
            width: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-orange);
        }

        .btn-primary {
            background: var(--gradient-accent);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 71, 126, 0.35);
        }

        /* HERO SECTION CON FONDO ALINEADO AL TOP */
        .hero-wrapper {
            position: relative;
            width: 100%;
            background: linear-gradient(180deg, rgba(11, 12, 16, 0.7) 0%, rgba(11, 12, 16, 0.92) 80%, #0b0c10 100%), 
                        url('https://raw.githubusercontent.com/mcmelgar75/earcandytown/refs/heads/main/hero.jpeg') top center / cover no-repeat;
            padding: 7rem 1.5rem 5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.2rem;
            color: #e0e6ed;
            margin-bottom: 2.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* SEARCH & FILTER */
        .search-container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 1.1rem 1.5rem 1.1rem 3.4rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(21, 23, 30, 0.85);
            backdrop-filter: blur(8px);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-container input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 20px rgba(255, 126, 41, 0.3);
        }

        .search-container i {
            position: absolute;
            left: 1.4rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* ARTISTS GRID */
        .artists-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 1.5rem 5rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }
