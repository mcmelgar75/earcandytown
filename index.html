<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarCandy - Booking & Representación Artística</title>
    <meta name="description" content="Contratación directa de los mejores artistas, bandas y DJs para marcas, festivales y eventos.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="cropped-earcandy-iso.png">
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0b0c10;
            --bg-card: #15171e;
            --bg-card-hover: #1e222d;
            --text-main: #ffffff;
            --text-muted: #a0a5b5;
            --accent-orange: #ff7e29;
            --accent-pink: #ff477e;
            --gradient-accent: linear-gradient(135deg, #ff9e2c 0%, #ff5e62 50%, #ff477e 100%);
            --font-family: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* HEADER & NAV */
        header {
            position: sticky;
            top: 0;
            background: rgba(11, 12, 16, 0.9);
            backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            height: 42px;
            width: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-orange);
        }

        .btn-primary {
            background: var(--gradient-accent);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 71, 126, 0.35);
        }

        /* HERO SECTION */
        .hero {
            padding: 5rem 1.5rem 4rem;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        /* SEARCH & FILTER */
        .search-container {
            max-width: 600px;
            margin: 0 auto 3rem;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 1rem 1.5rem 1rem 3.2rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-container input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 15px rgba(255, 126, 41, 0.2);
        }

        .search-container i {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* ARTISTS GRID */
        .artists-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem 5rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .grid-artists {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .artist-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s, background 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .artist-card:hover {
            transform: translateY(-5px);
            background: var(--bg-card-hover);
            border-color: rgba(255, 126, 41, 0.4);
        }

        .artist-info {
            margin-bottom: 1.2rem;
        }

        .artist-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .artist-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn-instagram {
            color: #e1306c;
            background: rgba(225, 48, 108, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-instagram:hover {
            background: #e1306c;
            color: #fff;
            transform: scale(1.05);
        }

        .btn-book {
            flex: 1;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.3s;
        }

        .btn-book:hover {
            background: var(--gradient-accent);
            color: #fff;
        }

        /* CONTACT SECTION */
        .contact-section {
            background: var(--bg-card);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 5rem 1.5rem;
        }

        .contact-container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .contact-container h2 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .contact-container p {
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border-radius: 8px;
            background: var(--bg-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--accent-orange);
        }

        /* FOOTER */
        footer {
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo">
                <img src="Logo-EarCandy-Transparent.png" alt="EarCandy Logo">
            </a>
            <ul class="nav-links">
                <li><a href="#artistas">Roster de Artistas</a></li>
                <li><a href="#contacto">Contacto & Booking</a></li>
            </ul>
            <a href="#contacto" class="btn-primary">Contratar Artista</a>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero">
        <h1>Conecta con los mejores talentos y artistas</h1>
        <p>Representación y booking exclusivo para marcas, productores de shows, festiv
